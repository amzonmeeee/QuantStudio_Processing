[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "QuantStudio-Processing"
version = "0.1.0"
description = "Tidy, QC and plot QuantStudio-family qPCR exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qsp = "quantstudio_processing.cli:main"

[tool.setuptools]
packages = ["quantstudio_processing"]

[tool.setuptools.package-data]
quantstudio_processing = ["web/*"]
